<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #2a2318;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 2rem 1rem;
  }

  .document {
    width: 780px;
    max-width: 100%;
    background: #ede4cc;
    position: relative;
    transform: rotate(-0.2deg);
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.35),
      4px 6px 20px rgba(0,0,0,0.65),
      8px 14px 44px rgba(0,0,0,0.45);
  }

  /* paper grain */
  .document::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.045'/%3E%3C/svg%3E");
    background-size: 200px;
    pointer-events: none;
    z-index: 20;
    opacity: 0.8;
  }

  /* edge vignette */
  .document::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.14) 100%);
    pointer-events: none;
    z-index: 19;
  }

  .page {
    padding: 1.6rem 1.8rem 1.8rem;
    position: relative;
  }

  /* map title bar */
  .map-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 1.5px solid #7a6a4a;
    padding-bottom: 8px;
    margin-bottom: 12px;
  }

  .map-title {
    font-family: 'Courier Prime', monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #2a1e08;
  }

  .map-ref {
    font-family: 'Courier Prime', monospace;
    font-size: 8.5px;
    color: #8a7a58;
    letter-spacing: 0.08em;
    text-align: right;
    line-height: 1.8;
  }

  .map-wrap {
    width: 100%;
    border: 1px solid #a09070;
    overflow: hidden;
    position: relative;
  }

  .map-wrap svg {
    display: block;
    width: 100%;
    height: auto;
  }

  .map-footer {
    margin-top: 10px;
    display: flex;
    justify-content: space-between;
    font-family: 'Courier Prime', monospace;
    font-size: 8px;
    color: #8a7a58;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border-top: 0.5px solid #b0a080;
    padding-top: 7px;
  }
</style>
</head>
